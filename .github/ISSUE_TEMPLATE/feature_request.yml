name: Feature request
description: Suggest an algorithm, option or API change.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need
      description: The use case first, then the change you have in mind. For a new algorithm, link its specification and published test vectors.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
