name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the upstream crypto-api checkout (the parity oracle)
        run: scripts/fetch-upstream.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install build tools (esbuild, Babel, Terser for the package bundles)
        run: npm ci --ignore-scripts
      - name: Install Zig
        run: |
          scripts/install-zig.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Embed wasm (the facades import the generated modules; small is what ships)
        run: zig build js --release=small
      - name: Parity harness (original suite + differential fuzz)
        run: npm run test:parity
      - name: Package (bundles, npm pack, smoke imports, Chromium global build)
        run: |
          npm install --no-save --ignore-scripts playwright@1.64.1
          npx playwright install --with-deps chromium
          npm run test:package
      - run: zig build check
      - run: zig build check --release=small
      - run: zig build wasm --release=small

  # The packed tarball installed the way Bun and Deno users install it: exports map, per-algorithm entries,
  # require(), an npm: specifier and wasm loading. Oldest supported release of each, and the current one.
  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: oldest, bun: "1.1.0", deno: "2.0.0" }
          - { label: current, bun: latest, deno: v2.x }
    name: runtimes (${{ matrix.label }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno }}
      - run: npm ci --ignore-scripts
      - name: Install Zig
        run: |
          scripts/install-zig.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: zig build js --release=small
      - run: bun --version && deno --version
      - name: Tarball through Node, Bun and Deno
        run: npm run test:runtimes -- --runtime node,bun,deno
