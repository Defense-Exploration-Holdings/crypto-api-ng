name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install build tools (esbuild, Babel, Terser for the package bundles)
        run: npm ci
      - name: Install Zig
        run: |
          scripts/install-zig.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Embed wasm (the facades import the generated modules)
        run: zig build js
      - name: Parity harness (original suite + differential fuzz)
        run: npm run test:parity
      - name: Package (bundles, npm pack, smoke imports, Chromium global build)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:package
      - run: zig build check
      - run: zig build check --release=small
      - run: zig build wasm --release=small
