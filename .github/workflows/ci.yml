name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the upstream crypto-api checkout (the parity oracle)
        run: scripts/fetch-upstream.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install build tools (esbuild, Babel, Terser for the package bundles)
        run: npm ci --ignore-scripts
      - name: Install Zig
        run: |
          scripts/install-zig.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Embed wasm (the facades import the generated modules; small is what ships)
        run: zig build js --release=small
      - name: Parity harness (original suite + differential fuzz)
        run: npm run test:parity
      - name: Package (bundles, npm pack, smoke imports, Chromium global build)
        run: |
          npm install --no-save --ignore-scripts playwright@1.64.1
          npx playwright install --with-deps chromium
          npm run test:package
      - run: zig build check
      - run: zig build check --release=small
      - run: zig build wasm --release=small
