name: Publish to npm
# Publishes packages/crypto-api to npm when a v* tag reaches the public repository.
#
# Three jobs, so that nothing that installs or runs third-party code can publish:
#
#   build    Checks the tag, builds, runs the tests, packs the tarball and uploads it
#            with its SHA-256. Read-only token, no environment, no OIDC token.
#   publish  Downloads that tarball, verifies the SHA-256 and runs `npm publish`.
#            This is the only job that holds the OIDC token. It does not check out the
#            repository, install dependencies or run any build or test code.
#   release  After a successful publish, creates the GitHub Release for the tag with the
#            CHANGELOG section as its notes and the tarball and its checksum attached.
#            This is the only job with a write token (contents: write). It does not check
#            out the repository or run any build or test code either.
#
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere. On npmjs.com,
# crypto-api-ng -> Settings -> Trusted Publisher -> GitHub Actions with
#   organization: Defense-Exploration-Holdings, repository: crypto-api-ng,
#   workflow filename: publish.yml, environment: npm
# and a GitHub environment named `npm` on that repository (add required reviewers there
# if a release should wait for a person; the `publish` job waits for them after `build`
# has passed). Job names are not part of the trusted publisher configuration.
#
# Release: set "version" in packages/crypto-api/package.json and add a CHANGELOG entry,
# merge, then push the matching tag (version 1.2.3 -> tag v1.2.3). The build job refuses
# a tag that does not match the package version. Versions with a pre-release part
# (1.2.3-rc.1) are published under the `next` dist-tag instead of `latest`, and 1.0.x
# maintenance releases (tagged on the `v1` branch) under `v1-latest`, so `latest` stays on
# the current line. The GitHub Release is marked as the latest release only for the main
# line (no pre-release part, not 1.0.x), so a 1.0.x maintenance release or a release
# candidate never takes the "Latest" badge. A Release that already exists for the tag is
# left as it is.
#
# If a publish fails after the tag exists (a tag is never moved), fix the workflow on main
# and run it from main with Actions -> Publish to npm -> Run workflow, giving the existing
# tag. It builds and publishes the tagged commit, not main.
#
# Pinned versions to keep current by hand: npm in the publish job (trusted publishing
# needs 11.5.1 or later) and Playwright in the build job. Actions are pinned by commit
# and updated by Dependabot.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v1.2.3"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    # Only the public repository is a trusted publisher; elsewhere the jobs are skipped.
    if: github.repository == 'Defense-Exploration-Holdings/crypto-api-ng'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check the release tag format
        run: |
          # Strict on purpose: git allows characters such as $ ( ) ; and ` in tag names.
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$RELEASE_TAG" =~ $re ]]; then
            shown="${RELEASE_TAG//[^0-9A-Za-z._-]/?}" # never echo raw input into workflow commands
            echo "::error::'$shown' is not a release tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check the tag matches the package version
        id: version
        run: |
          version="$(node -p "require('./packages/crypto-api/package.json').version")"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::tag $RELEASE_TAG does not match packages/crypto-api/package.json version $version"
            exit 1
          fi
          case "$version" in *-*) tag=next ;; 1.0.*) tag=v1-latest ;; *) tag=latest ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-notes
          # The body of the "## <version>" section, up to the next "## " heading, without
          # the blank lines around it.
          awk -v head="## $VERSION" '
            index($0, "## ") == 1 { if (on) exit; h = length(head); on = (index($0, head) == 1 && (length($0) == h || substr($0, h + 1, 1) == " ")); next }
            on { lines[++n] = $0 }
            END {
              s = 1; while (s <= n && lines[s] == "") s++
              e = n; while (e >= s && lines[e] == "") e--
              for (i = s; i <= e; i++) print lines[i]
            }
          ' packages/crypto-api/CHANGELOG.md > release-notes/changelog.md
          {
            if [ -s release-notes/changelog.md ]; then
              cat release-notes/changelog.md
            else
              echo "See the changelog for this version."
            fi
            printf '\n## Install\n\n```sh\nnpm install crypto-api-ng@%s\n```\n\n' "$VERSION"
            printf 'Published with npm provenance. See the [changelog](https://github.com/%s/blob/%s/packages/crypto-api/CHANGELOG.md).\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          } > release-notes/notes.md
          rm release-notes/changelog.md
          cat release-notes/notes.md

      - name: Fetch the upstream crypto-api checkout (the parity oracle)
        run: scripts/fetch-upstream.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install build tools (without install scripts)
        run: npm ci --ignore-scripts
      - name: Install Zig
        run: |
          scripts/install-zig.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and test the shipped mode
        run: |
          zig build js --release=small
          zig build check --release=small
          npm run test:parity
      - name: Package tests (bundles, npm pack, smoke imports, Chromium global build)
        run: |
          npm install --no-save --ignore-scripts playwright@1.64.1
          npx playwright install --with-deps chromium
          npm run test:package

      - name: Pack the public package
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/build-package.mjs --pack --name crypto-api-ng --public
          mkdir release
          cp "dist/crypto-api-ng-$VERSION.tgz" release/
          cd release
          sha256sum "crypto-api-ng-$VERSION.tgz" | tee "crypto-api-ng-$VERSION.tgz.sha256"
          echo "sha256=$(cut -d' ' -f1 "crypto-api-ng-$VERSION.tgz.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'Defense-Exploration-Holdings/crypto-api-ng'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # OIDC token for npm trusted publishing (and provenance)
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DIST_TAG: ${{ needs.build.outputs.dist_tag }}
      EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # same major as .nvmrc; there is no checkout in this job
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support (11.5.1 or later), exact version
        run: npm install -g --ignore-scripts npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release

      - name: Verify the tarball
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          [[ "$DIST_TAG" == latest || "$DIST_TAG" == next || "$DIST_TAG" == v1-latest ]] || { echo "::error::bad dist-tag"; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad checksum from the build job"; exit 1; }
          cd release
          tarball="crypto-api-ng-$VERSION.tgz"
          [ "$(ls | sort | tr '\n' ' ')" = "$tarball $tarball.sha256 " ] || { echo "::error::unexpected files in the artifact"; ls -la; exit 1; }
          sha256sum -c "$tarball.sha256"
          [ "$(sha256sum "$tarball" | cut -d' ' -f1)" = "$EXPECTED_SHA256" ] || { echo "::error::tarball differs from the checksum the build job reported"; exit 1; }
          tar -tzf "$tarball" | sort
          tar -xzOf "$tarball" package/package.json | node -e '
            const p = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (p.name !== "crypto-api-ng" || p.version !== process.env.VERSION || p.private) {
              console.error("::error::package.json in the tarball does not match", p.name, p.version, p.private);
              process.exit(1);
            }'

      - name: Publish
        run: |
          # The leading ./ matters: without it npm reads release/x.tgz as a GitHub user/repo shorthand.
          npm publish "./release/crypto-api-ng-$VERSION.tgz" --access public --tag "$DIST_TAG"

  release:
    needs: [build, publish]
    if: github.repository == 'Defense-Exploration-Holdings/crypto-api-ng'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release (never a tag: --verify-tag)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      DIST_TAG: ${{ needs.build.outputs.dist_tag }}
      EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      - name: Create the GitHub Release
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          [ "v$VERSION" = "$RELEASE_TAG" ] || { echo "::error::tag and version differ"; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad checksum from the build job"; exit 1; }
          tarball="release/crypto-api-ng-$VERSION.tgz"
          [ "$(sha256sum "$tarball" | cut -d' ' -f1)" = "$EXPECTED_SHA256" ] || { echo "::error::tarball differs from the checksum the build job reported"; exit 1; }

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; leaving it as it is."
            exit 0
          fi

          # Only the main line is the latest release. Release candidates are pre-releases;
          # 1.0.x (dist-tag v1-latest) is a maintenance line and must not take the badge.
          case "$DIST_TAG" in
            latest) flags=(--latest) ;;
            next) flags=(--prerelease --latest=false) ;;
            *) flags=(--latest=false) ;;
          esac

          # --verify-tag: fail if the tag is missing instead of creating one from the default branch.
          gh release create "$RELEASE_TAG" "$tarball" "$tarball.sha256" \
            --verify-tag --title "$RELEASE_TAG" --notes-file release-notes/notes.md "${flags[@]}"
